name: ci

# Test every PR and push to main. Every test runs the wasm engine, with the
# pinned release downloaded from lilypond-wasi like a real consumer — no
# Nix, no installed LilyPond, nothing beyond Node.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      - name: Assemble engine dir from the pinned release
        run: node scripts/assemble-engine-dir.mjs

      - run: npx vitest run

  # Same suite on Windows (uvwasi's missing fd_readdir is polyfilled in
  # the worker). Not a required check until it has proven stable.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      - name: Assemble engine dir from the pinned release
        run: node scripts/assemble-engine-dir.mjs

      - run: npx vitest run
