name: ci

# Test every PR and push to main. Native tests run in the Nix dev shell
# (LilyPond 2.26 + cairo); wasm-backend tests run against an engine dir
# assembled from the pinned release, downloaded like a real consumer.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - run: nix develop --command npm ci
      - run: nix develop --command npm run build

      - name: Assemble engine dir from the pinned release
        run: |
          set -euo pipefail
          node - <<'JS'
          const { ensureEngine } = await import("./dist/engine/fetch.js");
          const { readFile } = await import("node:fs/promises");
          const pin = JSON.parse(await readFile("engine.json", "utf8"));
          const { dir } = await ensureEngine(pin);
          console.log("ENGINE_DIR=" + dir);
          JS
          echo "LILYPOND_MCP_ENGINE_DIR=$HOME/.cache/lilypond-mcp/engine/$(ls $HOME/.cache/lilypond-mcp/engine | head -1)" >> "$GITHUB_ENV"

      - run: nix develop --command npx vitest run

  # The wasm backend on Windows: no Nix, no native LilyPond — engine
  # downloaded from the pinned release like a real consumer, wasm suite
  # only (the native suite needs the Nix dev shell). Not a required
  # check until it has proven stable.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      - name: Assemble engine dir from the pinned release
        run: |
          node - <<'JS'
          const { ensureEngine } = await import("./dist/engine/fetch.js");
          const { readFile, appendFile } = await import("node:fs/promises");
          const pin = JSON.parse(await readFile("engine.json", "utf8"));
          const { dir } = await ensureEngine(pin);
          await appendFile(process.env.GITHUB_ENV, `LILYPOND_MCP_ENGINE_DIR=${dir}\n`);
          console.log("engine dir:", dir);
          JS

      - run: npx vitest run test/wasm-backend.test.ts

      # DEBUG (temporary): can the guest readdir the fonts mount at all?
      - name: In-guest readdir probe
        if: failure()
        run: |
          cat > probe.ly <<'EOF'
          \version "2.26.0"
          #(begin
            (define (ls p)
              (format (current-error-port) "LS ~a:~%" p)
              (catch #t
                (lambda ()
                  (let ((d (opendir p)))
                    (let loop ()
                      (let ((e (readdir d)))
                        (unless (eof-object? e)
                          (format (current-error-port) "  entry: ~a~%" e)
                          (loop))))
                    (closedir d)))
                (lambda args
                  (format (current-error-port) "  ERROR: ~a~%" args))))
            (ls "/lilypond/fonts")
            (ls "/lilypond/fonts/otf"))
          { c'1 }
          EOF
          node - <<'JS' || true
          const { engraveWasm } = await import("./dist/engine/wasm-backend.js");
          const { readFile } = await import("node:fs/promises");
          const pin = JSON.parse(await readFile("engine.json", "utf8"));
          process.env.LILYPOND_MCP_DEBUG_JOB = "1";
          const r = await engraveWasm(
            { source: "probe.ly", name: "probe", outputDir: "probe-out",
              formats: ["svg"], crop: true, includeDirs: [] },
            pin,
          ).catch((e) => ({ ok: false, errors: String(e) }));
          console.log(r.errors ?? "engrave ok");
          JS
